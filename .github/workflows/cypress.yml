name: Cypress Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm install

      - name: Print Environment Variables (Debugging)
        run: |
          echo "PLATFORM_URL=$PLATFORM_URL"
          echo "BASE_URL=$BASE_URL"
        env:
          PLATFORM_URL: https://vcst-qa-storefront.govirto.com
          BASE_URL: https://vcst-qa.govirto.com

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          record: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM_URL: https://vcst-qa-storefront.govirto.com
          #PLATFORM_URL: https://vcptcore-qa-storefront.govirto.com
          BASE_URL: https://vcst-qa.govirto.com
          #BASE_URL: https://vcptcore-qa.govirto.com
          ADMIN_NAME: admin
          ADMIN_PASSWORD: Password1!
          API_KEY: ${{ secrets.API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          LOGIN_CORP_EMAIL: ricreyacrouyi-3425@yopmail.com
          LOGIN_CORP_PASSWORD: Password1
          CARD_NUMBER_VISA: 4007000000027
          CVV: 900

